name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test on Go ${{ matrix.go-version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        go-version: ['1.21', '1.22', '1.23']
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Verify Code-Gen Drift
        run: |
          go generate ./...
          git diff --exit-code

      - name: Go Vet
        run: go vet ./...

      - name: Run Tests (with Race Detector)
        run: go test -v -race ./...

      - name: Run Tests (Allocation Checks)
        run: go test -v -run TestZeroAllocations ./...

      - name: Run Benchmarks
        run: go test -bench=. -benchmem ./...

      - name: Verify Example Modules
        run: |
          cd examples/gorm && go run main.go
          cd ../fiber && go run main.go
